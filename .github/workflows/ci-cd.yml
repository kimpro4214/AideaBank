name: Deploy Spring Boot App to EC2

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v3

      # 2) JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3) Gradle cache
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4) gradlew 실행 권한
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5) Build (skip tests)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 6) Find executable JAR (exclude *-plain.jar)
      - name: Find built JAR
        id: find_jar
        run: |
          set -euo pipefail
          JAR_FILE=$(ls build/libs | grep -E '\.jar$' | grep -v plain | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ No executable JAR found in build/libs"
            exit 1
          fi
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR_FILE"

      # 7) Prepare EC2 target dir
      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p /home/${{ secrets.SERVER_USER }}/app

      # 8) Copy jar to EC2
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: build/libs/${{ steps.find_jar.outputs.JAR_FILE }}
          target: /home/${{ secrets.SERVER_USER }}/app/
          # build/libs/ 경로를 벗겨서 파일명만 전송
          strip_components: 2

      # 9) Deploy & run on EC2
      - name: Deploy & Run
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            APP_DIR="/home/${{ secrets.SERVER_USER }}/app"
            JAR_NAME="${{ steps.find_jar.outputs.JAR_FILE }}"   # 예: app-1.2.3.jar 또는 app.jar
            APP_JAR="app.jar"                                   # 서비스가 바라볼 고정 이름
            LOG_DIR="${APP_DIR}/logs"

            cd "$APP_DIR"

            echo "Checking for JAR file: $JAR_NAME"
            if [ ! -f "$JAR_NAME" ]; then
              echo "❌ JAR file not found: $JAR_NAME"
              echo "Files in current directory:"
              ls -la
              exit 1
            fi

            # 기존 8080 프로세스 종료
            EXISTING_PID="$(lsof -t -i:8080 || true)"
            if [ -n "$EXISTING_PID" ]; then
              echo "Stopping PID $EXISTING_PID"
              kill -15 "$EXISTING_PID" || true
              sleep 5
            fi

            # 고정 링크(app.jar) 만들기 - 동일 파일/경로면 건너뜀
            if [ "$JAR_NAME" != "$APP_JAR" ]; then
              SRC_REAL="$(readlink -f "$JAR_NAME")"
              DST_REAL="$(readlink -f "$APP_JAR" 2>/dev/null || echo "")"
              if [ "$SRC_REAL" != "$DST_REAL" ]; then
                ln -sfn "$JAR_NAME" "$APP_JAR"
              fi
            else
              # 이름 자체가 같으면 링크 불필요
              :
            fi

            # 로그 디렉토리 준비
            mkdir -p "$LOG_DIR"
            LOG_FILE="$LOG_DIR/$(date +'%Y-%m-%d_%H-%M-%S').log"

            echo "Starting $APP_JAR ..."
            # 필요 시 JAVA_OPTS를 GitHub Secrets/Env로 주입 가능
            nohup java ${JAVA_OPTS:-} -jar "$APP_JAR" > "$LOG_FILE" 2>&1 &

            # 기동 확인
            sleep 10
            NEW_PID="$(lsof -t -i:8080 || true)"
            if [ -n "$NEW_PID" ]; then
              echo "✅ Started successfully. PID=$NEW_PID"
            else
              echo "❌ Failed to start. Showing logs:"
              tail -n 200 "$LOG_FILE" || true
              exit 1
            fi
