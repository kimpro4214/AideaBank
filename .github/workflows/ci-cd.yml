name: Deploy Spring Boot App to EC2

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v3

      # 2) JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3) Gradle cache
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4) gradlew 실행 권한
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5) Build (skip tests)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 6) Find executable JAR (exclude *-plain.jar)
      - name: Find built JAR
        id: find_jar
        run: |
          JAR_FILE=$(ls build/libs | grep -E '\.jar$' | grep -v plain | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ No executable JAR found in build/libs"
            exit 1
          fi
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR_FILE"

      # 7) Prepare EC2 target dir
      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p /home/${{ secrets.SERVER_USER }}/app

      # 8) Copy jar to EC2
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: build/libs/${{ steps.find_jar.outputs.JAR_FILE }}
          target: /home/${{ secrets.SERVER_USER }}/app/
          overwrite: true

      # 9) Deploy & run on EC2
      - name: Deploy & Run
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="/home/${USER}/app"
            JAR_NAME="${{ steps.find_jar.outputs.JAR_FILE }}"
            APP_JAR="app.jar"
            LOG_DIR="${APP_DIR}/logs"

            cd $APP_DIR

            # 기존 프로세스 종료
            EXISTING_PID=$(lsof -t -i:8080 || true)
            if [ -n "$EXISTING_PID" ]; then
              echo "Stopping PID $EXISTING_PID"
              kill -15 $EXISTING_PID || true
              sleep 5
            fi

            # 심볼릭 링크 생성
            ln -sfn "$JAR_NAME" "$APP_JAR"

            # 로그 디렉토리 준비
            mkdir -p "$LOG_DIR"
            LOG_FILE="$LOG_DIR/$(date +'%Y-%m-%d_%H-%M-%S').log"

            echo "Starting $APP_JAR ..."
            nohup java -jar "$APP_JAR" > "$LOG_FILE" 2>&1 &

            sleep 10
            NEW_PID=$(lsof -t -i:8080 || true)
            if [ -n "$NEW_PID" ]; then
              echo "✅ Started successfully. PID=$NEW_PID"
            else
              echo "❌ Failed to start. Showing logs:"
              tail -n 100 "$LOG_FILE" || true
              exit 1
            fi
