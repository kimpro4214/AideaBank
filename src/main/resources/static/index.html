<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>메인 페이지</title>
</head>
<body>
<h1>배포 성공!</h1>
<p>배포가 성공적으로 완료되었습니다.</p>
<p>환영합니다!</p>

<script>
    const cookie = document.cookie;
    const token = cookie.split('; ').find(row => row.startsWith('jwtToken='));
    if (token) {
        console.log("JWT 토큰이 쿠키에 존재합니다:", token.split('=')[1]);
    } else {
        console.log("JWT 토큰이 없습니다.");
    }
</script>
</body>
</html>
