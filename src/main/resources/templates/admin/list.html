<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Product List</title>
</head>
<body>
<h1>상품 목록</h1>

<table border="1">
    <thead>
    <tr>
        <th>
            <a th:href="@{|/admin/products?page=0&sort=id,asc|}">ID ↑</a>
            <a th:href="@{|/admin/products?page=0&sort=id,desc|}">↓</a>
        </th>
        <th>
            <a th:href="@{|/admin/products?page=0&sort=name,asc|}">상품명 ↑</a>
            <a th:href="@{|/admin/products?page=0&sort=name,desc|}">↓</a>
        </th>
        <th>
            <a th:href="@{|/admin/products?page=0&sort=price,asc|}">가격 ↑</a>
            <a th:href="@{|/admin/products?page=0&sort=price,desc|}">↓</a>
        </th>
        <th>이미지</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${productPage.content}">
        <td th:text="${product.id}">1</td>
        <td th:text="${product.name}">아이스 아메리카노</td>
        <td th:text="${product.price}">4500</td>
        <td>
            <img th:src="${product.imageUrl}" alt="상품 이미지" width="50"/>
        </td>
        <td>
            <a th:href="@{'/admin/products/' + ${product.id} + '/edit'}">수정</a>
            <form th:action="@{'/admin/products/' + ${product.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<!-- 페이지네이션 UI -->
<div>
    <span th:text="'페이지: ' + (${productPage.number + 1}) + ' / ' + ${productPage.totalPages}">페이지 정보</span>

    <div>
        <a th:href="@{|/admin/products?page=0&sort=${currentSort}|}">처음</a>
        <a th:if="${productPage.hasPrevious()}"
           th:href="@{|/admin/products?page=${productPage.number - 1}&sort=${currentSort}|}">이전</a>

        <span th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}">
            <a th:href="@{|/admin/products?page=${i}&sort=${currentSort}|}"
               th:text="${i + 1}"
               th:classappend="${i == productPage.number} ? 'active' : ''">1</a>
        </span>

        <a th:if="${productPage.hasNext()}"
           th:href="@{|/admin/products?page=${productPage.number + 1}&sort=${currentSort}|}">다음</a>
        <a th:href="@{|/admin/products?page=${productPage.totalPages - 1}&sort=${currentSort}|}">마지막</a>
    </div>
</div>

<a href="/admin/products/new">상품 등록</a>
</body>
</html>
