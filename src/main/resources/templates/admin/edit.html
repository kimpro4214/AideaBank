<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>상품 수정</title>
</head>
<body>
<h1>상품 수정</h1>

<form th:action="@{|/admin/products/${product.id}/edit|}" method="post">
    <input type="hidden" name="id" th:value="${product.id}" />

    <div>
        <label>상품명:</label>
        <input type="text" name="name" th:value="${product.name}" />
    </div>
    <div>
        <label>가격:</label>
        <input type="number" name="price" th:value="${product.price}" />
    </div>
    <div>
        <label>이미지 URL:</label>
        <input type="text" name="imageUrl" th:value="${product.imageUrl}" />
    </div>
    <div>
        <button type="submit">수정 완료</button>
    </div>
</form>

<hr>

<h2>옵션 목록</h2>
<ul>
    <li th:each="opt : ${product.options}">
        <span th:text="${opt.name()}">옵션 이름</span> /
        <span th:text="${opt.quantity()}">수량</span>
    </li>
</ul>

<h2>옵션 추가</h2>
<form th:action="@{|/admin/products/${product.id}/options|}" method="post">
    <div>
        <label>옵션 이름:</label>
        <input type="text" name="name" maxlength="50" required>
    </div>
    <div>
        <label>수량:</label>
        <input type="number" name="quantity" min="1" max="99999999" required>
    </div>
    <div>
        <button type="submit">옵션 추가</button>
    </div>
</form>

<hr>
<a href="/admin/products">← 목록으로</a>
</body>
</html>
